count_cut = { fg = "#f5f5f5", bg = "#8d4c57" }
count_selected = { fg = "#f5f5f5", bg = "#496088" }

border_symbol = "│"
border_style = { fg = "#707a8f" }

syntect_theme = "~/.config/yazi/Poisonbloom-Light.tmTheme"

[tabs]
